<style>
#cd svg.classDiagram .divider path { stroke-opacity: 0.5; }
#cd svg.classDiagram .row-rect-odd path,
#cd svg.classDiagram .row-rect-odd rect,
#cd svg.classDiagram .row-rect-even path,
#cd svg.classDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const source = `classDiagram
  class AuthController {
    +login()
    +registro()
    +loginGoogle()
  }
  class AuthService {
    +autenticar()
    +registrar()
  }
  class JwtService {
    +generarToken()
    +validarToken()
  }
  class UsuarioRepository {
    <<interface>>
    +findByCorreo()
  }
  class Usuario {
    -Long id
    -String correo
    -String rol
  }

  class PersonajeController {
    +obtenerMiPersonaje()
    +actualizarPersonaje()
  }
  class PersonajeService {
    +crearPersonaje()
    +sumarXp()
    +usarPocion()
  }
  class PersonajeRepository {
    <<interface>>
    +findByUsuarioId()
  }
  class ClasePersonajeRepository {
    <<interface>>
    +findAll()
  }
  class NivelRepository {
    <<interface>>
    +findByNivel()
  }
  class Personaje {
    -Long id
    -String nombre
    -Integer nivel
    -Integer xpActual
  }

  class MisionController {
    +crearMision()
    +completarMision()
  }
  class MisionService {
    +completar()
    +calcularRecompensa()
  }
  class MisionRepository {
    <<interface>>
    +findByPersonajeId()
  }
  class Mision {
    -Long id
    -String nombre
    -String frecuencia
    -Integer rachaDias
  }

  class MetaController {
    +crearMeta()
  }
  class MetaService {
    +aplicarDano()
    +verificarDerrota()
  }
  class MetaRepository {
    <<interface>>
    +findByPersonajeId()
  }
  class Meta {
    -Long id
    -Integer vidaTotal
    -Integer vidaActual
  }

  class InsigniaService {
    +evaluarLogros()
  }
  class InsigniaRepository {
    <<interface>>
    +findAll()
  }
  class Insignia {
    -Long id
    -String nombre
  }

  AuthController --> AuthService
  AuthService --> JwtService
  AuthService --> UsuarioRepository
  UsuarioRepository ..> Usuario

  PersonajeController --> PersonajeService
  PersonajeService --> PersonajeRepository
  PersonajeService --> ClasePersonajeRepository
  PersonajeService --> NivelRepository
  PersonajeRepository ..> Personaje

  MisionController --> MisionService
  MisionService --> MisionRepository
  MisionRepository ..> Mision

  MetaController --> MetaService
  MetaService --> MetaRepository
  MetaRepository ..> Meta

  InsigniaService --> InsigniaRepository
  InsigniaRepository ..> Insignia

  PersonajeService --> MisionRepository
  MetaService --> MisionRepository`;
const { svg } = await mermaid.render('cd-svg', source);
document.getElementById('cd').innerHTML = svg;

document.querySelectorAll('#cd svg.classDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  rect.setAttribute('fill', '#2c2c2a');
  for (const a of ['stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
  const titleText = node.querySelector('text');
  if (titleText) {
    titleText.setAttribute('fill', '#ffffff');
    titleText.querySelectorAll('tspan').forEach(ts => ts.setAttribute('fill', '#ffffff'));
  }
});

document.querySelectorAll('#cd svg.classDiagram .row-rect-odd path, #cd svg.classDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
